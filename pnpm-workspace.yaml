allowBuilds:
  esbuild: set this to true or false
# pnpm 10.16+ reads build-script allowlisting from here, not package.json.
# esbuild ships prebuilt binaries and needs its install script to run; without
# this, `pnpm install` exits 1 with ERR_PNPM_IGNORED_BUILDS and vitest cannot run.
onlyBuiltDependencies:
  - esbuild
