# Nightly harvest — the scheduler for this project.
#
# Vercel Hobby cron cannot do this: it is capped at once per day with +/-59 min
# drift, and any more frequent expression fails at deploy time. See
# memory/DECISIONS.md entry 001.
#
# This workflow contains NO model calls. It harvests, hashes, filters and
# pre-scores — all deterministic, all free. Rows land in Neon as needs_scoring
# and wait for /daily-run.

name: nightly

on:
  # Seventeen minutes past, not on the hour. GitHub queues scheduled workflows
  # and drops them under load; the top of the hour is the most contended minute
  # there is, and a run was skipped outright on 2 September at 20:00.
  schedule:
    # 20:00 UTC Mon-Fri = 04:00 Manila (UTC+8)
    - cron: '17 20 * * 1-5'
    # Monthly retention. The `retention` job below is gated on this exact
    # string, so it must be declared here or that job never runs at all.
    - cron: '17 20 1 * *'
  workflow_dispatch: {}

concurrency:
  group: nightly
  cancel-in-progress: false

# Only what the notification step needs. The harvest itself writes nothing to
# GitHub, so the default read-only token is right for everything else.
permissions:
  contents: read
  issues: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The monthly cron exists only to trigger retention. On a weekday the 1st
    # fires both schedules, and the weekday one already covers the harvest.
    if: github.event.schedule != '0 20 1 * *'

    steps:
      - uses: actions/checkout@v5

      # No `version:` — action-setup reads the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Harvest: fetch, normalise, content-hash, upsert.
      # One adapter failing must not fail the run — handled inside harvest.ts.
      - name: Harvest sources
        run: pnpm harvest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Pre-filter: hard disqualifiers + deterministic rule scoring.
      # Survivors are marked needs_scoring. Target: 15-25 rows.
      - name: Pre-filter and pre-score
        run: pnpm prefilter
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Stage B for geo prospects. Bounded at 25: this reads other people's
      # servers at a second per host, and an unbounded loop in a nightly job is
      # how a polite crawler becomes an impolite one. Never fails the run — a
      # site being down is not a pipeline fault.
      - name: Enrich prospect websites
        continue-on-error: true
        run: pnpm enrich --limit=25
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Cheap, pure, no network. Re-scoring everything nightly means a weight
      # change takes effect without anyone remembering to run it.
      - name: Score prospects
        continue-on-error: true
        run: pnpm prospects:score
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # GitHub disables scheduled workflows after 60 days of repo inactivity.
      # This write keeps the repo active so the schedule survives quiet periods.
      - name: Keepalive
        run: pnpm keepalive
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Report funnel
        id: funnel
        run: pnpm report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # A run summary is only seen by someone who opens the run. This opens an
      # issue instead, which GitHub emails — so the morning triage starts by
      # being told, not by remembering to check.
      #
      # One open issue at a time: a nightly job that files a new issue every day
      # trains you to ignore them.
      - name: Notify when leads are waiting
        if: steps.funnel.outputs.needs_scoring != '0' && steps.funnel.outputs.needs_scoring != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WAITING: ${{ steps.funnel.outputs.needs_scoring }}
        run: |
          existing=$(gh issue list --label triage --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$WAITING lead(s) waiting at \`needs_scoring\` as of $(date -u +%Y-%m-%d). Run \`/daily-run\`."
          else
            gh issue create --label triage               --title "$WAITING lead(s) ready to triage"               --body "The nightly harvest left $WAITING lead(s) at \`needs_scoring\`.

          Run \`/daily-run\` in Claude Code to score, draft and verify them.

          Close this issue once the queue is clear; the next night will open a new one."
          fi

  # Monthly retention: prune dead rows so storage stays flat inside Neon's 0.5 GB.
  retention:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 20 1 * *'
    steps:
      - uses: actions/checkout@v5
      # No `version:` — action-setup reads the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm retention
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Businesses move and close, but slowly, and Overpass is a shared free
      # endpoint — monthly is the right cadence for re-reading the map.
      - name: Refresh prospects from OpenStreetMap
        continue-on-error: true
        run: pnpm prospects:refresh --limit=200
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
